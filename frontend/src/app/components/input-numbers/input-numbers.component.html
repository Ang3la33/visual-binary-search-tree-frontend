<div class="input-page">
  <h1>
    Binary Search <span class="tree-emoji">🌲</span>Tree<span class="tree-emoji">🌲</span> Visualizer
  </h1>

  <form class="input-form" (ngSubmit)="onSubmit()">

    <label for="numbers" class="label-center">
      Enter numbers here separated by commas:
    </label>


    <input
      type="text"
      id="numbers"
      [(ngModel)]="numbersInput"
      name="numbers"
      placeholder="e.g. 5,3,8,1,4"
      required
    />

    <div class="button-group">
      <button type="submit" class="btn-green">SUBMIT HERE</button>

      <button type="button" (click)="onShowPrevious()">SHOW PREVIOUS</button>
    </div>
  </form>
</div>
